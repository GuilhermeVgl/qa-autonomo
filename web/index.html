<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b5cff" />
    <title>QA Autônomo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // sets the theme before the first paint, so there is no flash of the wrong one
      try {
        var pref = localStorage.getItem("qa_theme");
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
