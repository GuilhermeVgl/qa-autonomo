version: "2"
sql:
  - &base
    engine: postgresql
    schema: db/migrations
    queries: db/queries/org.sql
    gen:
      go:
        package: org
        out: internal/org
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: github.com/google/uuid.NullUUID
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
