name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: control-plane } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: control-plane/go.mod, cache-dependency-path: control-plane/go.sum }
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v8
        with: { working-directory: control-plane }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest && gosec -exclude-generated ./...

  runner:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: runner } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm, cache-dependency-path: runner/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

  e2e:
    # runner (Chromium real) contra fixtures/sample-app; a exploração é determinística, sem LLM
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: runner } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm, cache-dependency-path: runner/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
