openapi: 3.0.3
info:
  title: Sample App API
  version: "1.0"
paths:
  /api/orders:
    get:
      summary: Lista pedidos
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /api/orders/{id}:
    get:
      summary: Detalha um pedido
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { description: não encontrado }
    delete:
      summary: Remove um pedido
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "204": { description: removido }
  /api/customers:
    get:
      summary: Lista clientes
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { type: object } }
components:
  schemas:
    Order:
      type: object
      required: [id, customer, total]
      properties:
        id: { type: integer }
        customer: { type: string }
        total: { type: number }
